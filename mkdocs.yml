site_name: AirBrush
site_description: A 3D pen for Paper servers — paint freehand on any surface, pick any color, and build it together with friends.
site_author: ShiftSad
site_url: https://shiftsad.github.io/AirBrush/

repo_name: ShiftSad/AirBrush
repo_url: https://github.com/ShiftSad/AirBrush
edit_uri: edit/master/docs/

theme:
  name: material
  language: en
  icon:
    repo: fontawesome/brands/github
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit
    - toc.follow
  palette:
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to system preference

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Tools & controls: tools.md
  - Craftings: craftings.md
  - Inks & cauldrons: inks.md
  - Commands: commands.md
  - Configuration: configuration.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.superfences
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra_css:
  - stylesheets/extra.css

extra:
  social:
    - icon: fontawesome/brands/discord
      link: https://discord.gg/JQVdVqyfDY
      name: Join the Discord
    - icon: simple/modrinth
      link: https://modrinth.com/plugin/AirBrush
      name: Download on Modrinth

copyright: AirBrush is licensed under the GNU General Public License v3.0
