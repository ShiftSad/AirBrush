<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Focus dot modifier">
  <defs>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)">
    <circle cx="100" cy="100" r="70" fill="none" stroke="#9b7dff" stroke-width="5"/>
    <circle cx="100" cy="100" r="11" fill="#d6a4ff" stroke="none"/>
  </g>
</svg>
