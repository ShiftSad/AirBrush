<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Division line modifier">
  <defs>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)">
    <circle cx="100" cy="100" r="70" stroke="#9b7dff" stroke-width="5"/>
    <line x1="30" y1="100" x2="170" y2="100" stroke="#d6a4ff" stroke-width="5"/>
  </g>
</svg>
